name: Python syntax

on:
  push:
    branches: [main, dev, uat]
  pull_request:

jobs:
  compile-python:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile Python sources
        run: python -m compileall -q notebooks
